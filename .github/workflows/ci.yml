name: Stock Tracker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore StockTracker.sln

    - name: Build Solution (Release)
      run: dotnet build StockTracker.sln --configuration Release --no-restore

    - name: Run Automated Test Suite (253 tests)
      run: dotnet test StockTracker.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"
